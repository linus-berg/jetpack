# Jetpack as a drop-in replacement for plugins.jetbrains.com.
#
#   cd deploy
#   ./generate-certs.sh jetpack.corp.example   # or use certificates from your CA
#   echo "JETPACK_API_KEY=$(openssl rand -hex 24)" > .env
#   docker compose up -d
#
# Then point plugins.jetbrains.com + downloads.marketplace.jetbrains.com at this
# host in DNS and trust certs/ca.crt on developer machines (see README).
services:
  jetpack:
    image: ghcr.io/linus-berg/jetpack/api:latest
    # build: { context: .., dockerfile: Jetpack.Api/Dockerfile }
    restart: unless-stopped
    ports:
      - "443:8443"
      - "80:8080"
    environment:
      Jetpack__ApiKey: ${JETPACK_API_KEY:?set JETPACK_API_KEY in .env}
      ASPNETCORE_HTTP_PORTS: "8080"
      ASPNETCORE_HTTPS_PORTS: "8443"
      ASPNETCORE_Kestrel__Certificates__Default__Path: /certs/jetpack.crt
      ASPNETCORE_Kestrel__Certificates__Default__KeyPath: /certs/jetpack.key
      # File system storage in the "jetpack-data" volume (default). To keep
      # using MinIO/S3 instead, uncomment:
      # Storage__Provider: S3
      # Storage__S3__Endpoint: minio.corp.example:9000
      # Storage__S3__AccessKey: ${S3_ACCESS_KEY}
      # Storage__S3__SecretKey: ${S3_SECRET_KEY}
      # Storage__S3__Secure: "true"
      # Storage__S3__Bucket: jetpack
      # Storage__S3__Prefix: jetpack
    volumes:
      - jetpack-data:/data
      - ./certs:/certs:ro
    healthcheck:
      # The runtime image has no curl; use bash's /dev/tcp.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '\"ok\"' <&3"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  jetpack-data:
